# ##### claude 2026/9/7 start #####
# ======================================================================
# ESMFold2 × ProteinMPNN × BindCraft 集成 pipeline 环境配置
#
# 依赖来源 (按上游工作流逐一核对):
#   1. BindCraft 工作流:   BindCraft-main/install_bindcraft.sh
#   2. biohub-esm 工作流:  biohub-esm/esm-main/pyproject.toml (esm 3.3.0)
#   3. 版本钉扎权威来源:    pipeline/run_modal.py 镜像定义
#
# 版本裁决 (两工作流冲突项):
#   - python 3.12:  esm 3.3.0 硬性要求 (>=3.12,<3.13),
#                   BindCraft 原生 3.10 被覆盖 (pipeline 只移植了其过滤
#                   函数, 不需要其 AF2 全栈)
#   - transformers: Biohub fork (github.com/Biohub/transformers),
#                   提供 mainline 没有的 transformers.models.esmfold2_*
#                   模块 (esmcp/binder_design.py 直接 import);
#                   本地克隆: /home/taoyr/projects/biohub-transformers
#   - numpy:        不显式钉扎。BindCraft 原生要求 <2.0.0 仅为适配其
#                   AF2 部分; pipeline 移植部分 (biopython/scipy/pandas)
#                   与 esm 3.3.0 均兼容 numpy2
#   - jaxlib:       环境内含 cuda-version=12.8 时, conda-forge 求解器
#                   会自动选 CUDA 构建本 (实测 jax.devices() 可见全部
#                   GPU), 无需再手动换 GPU 变体
#
# 使用:
#   conda env create -f environment.yml
#   conda activate esmbind
#   # 再执行文件尾"手动安装步骤"(colabdesign 等)
# ======================================================================
# ##### claude 2026/9/7 end #####

name: esmbind
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip

  # ---- CUDA 12.8 工具链 (与 run_modal.py Modal 镜像一致) ----
  # ---- 全部 GPU 库均走 pip 预编译 wheel, 仅源码编译时需要 nvcc ----
  - cuda-version=12.8
  - cuda-libraries-dev=12.8
  - cuda-nvcc=12.8
  - cmake
  - ninja
  - git

  # ---- abnumber 抗体编号依赖 (esmcp/binder_design.py) ----
  # ---- anarci/hmmer 仅 conda 渠道提供, 故放此处 ----
  - anarci>=2020.04.03
  - hmmer=3.4

  # ---- ProteinMPNN (colabdesign) 的 JAX 栈 ----
  # ---- 照抄 BindCraft install_bindcraft.sh 配方; ----
  # ---- jaxlib 默认为 CPU 版, GPU 变体见文件头注释命令 ----
  - jax>=0.4,<=0.6.0
  - jaxlib>=0.4,<=0.6.0
  - flax<0.10.0
  - dm-haiku
  - dm-tree
  - ml-collections
  - immutabledict
  - optax
  - chex
  - joblib

  # ---- 通用科学计算 (BindCraft 配方 + pipeline 直接 import) ----
  - biopython
  - scipy
  - pandas
  - tqdm

  # ---- pip 区: torch 生态 + biohub-esm 工作流 ----
  - pip:
      # cu128 官方索引优先: torch==2.8.0 解析为 2.8.0+cu128 (PEP440
      # 本地版本高于 PyPI 同名 wheel, 不会误装其他 CUDA 变体);
      # 其余包回落 PyPI
      - --index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.org/simple
      - torch==2.8.0
      - triton==3.4.0
      # flash-attn: PyPI 仅有 sdist, 其 setup.py 在构建期 import torch,
      # 在 pip 隔离构建环境内必报 ModuleNotFoundError; 改用官方预编译
      # wheel (cu12 + torch2.8 + cxx11abiTRUE, 与 torch==2.8.0+cu128 匹配)
      - https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl
      - transformer-engine[core-cu12,pytorch]==2.13.0
      - xformers==0.0.32.post1
      # biohub-esm 工作流 (esm 3.3.0); 其 pyproject 自动带入
      # biotite/rdkit/einops/py3dmol/pydssp/accelerate 及 DockQ 等
      # 次要依赖
      # 注意: 上游 git@main 已漂移到 3.4.1 (要求 torch>=2.11, 与上方
      # torch==2.8.0 冲突), 且仓库无 v3.3.0 tag 可钉, 故钉本地克隆快照
      - /home/taoyr/projects/biohub-esm/esm-main
      # esm 3.3.0 pyproject 声明的 DockQ fork (numpy2 兼容版), 显式列出
      - 'dockq @ git+https://github.com/nrontsis/DockQ.git@ba4df5adaad7c77fd60851d0b7b05f2b77061ba2'
      # Biohub transformers fork (esm 3.3.0 的依赖, 此处显式声明;
      # 本地克隆: /home/taoyr/projects/biohub-transformers/transformers-main)
      - 'transformers @ git+https://github.com/Biohub/transformers.git@main'
      # pipeline 直接依赖
      - abnumber
      - modal
      - pyarrow

